name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: API
        run: |
          mkdir p && cd p && flutter create --platforms android x && cd x
          flutter pub add flutter_edge_ai flutter_edge_ai_litertlm flutter_edge_ai_embeddings > /dev/null 2>&1 || flutter pub add flutter_edge_ai flutter_edge_ai_litertlm flutter_edge_ai_embeddings
          E=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name "flutter_edge_ai-2*" | sort | tail -1)
          L=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name "flutter_edge_ai_litertlm-*" | sort | tail -1)
          F=$E/lib/src/api/flutter_edge_ai.dart
          grep -n "static " $F | grep -i -E "embed|catalog|initialize" 
          sed -n 300,335p $F; sed -n 915,970p $F
          grep -n -i -A30 "installEmbedderFromCatalog\|static .*FromCatalog" $F | grep -v "///" | head -60
          B=$(grep -rln "class EmbeddingInstallationBuilder" $E/lib); grep -n -E "^  [A-Za-z].*\(|^  [A-Za-z<>?]+ get " $B | head -40
          grep -n -A20 "static Future<void> initialize" $F | head -30
          curl -s https://huggingface.co/api/models/litert-community/embeddinggemma-2-text-270m-litert-lm | head -c 600; echo
          curl -sIL https://huggingface.co/litert-community/embeddinggemma-2-text-270m-litert-lm/resolve/9be6e8b90982095dc05c2bd162e4b954ee4dbac7/embeddinggemma-2-text-270m.litertlm | grep -iE '^HTTP|content-length'
          curl -s https://huggingface.co/litert-community/embeddinggemma-2-text-270m-litert-lm/raw/main/README.md | head -80
