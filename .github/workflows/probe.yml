name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: API
        run: |
          mkdir p && cd p && flutter create --platforms android x && cd x
          flutter pub add flutter_edge_ai flutter_edge_ai_litertlm flutter_edge_ai_embeddings > /dev/null 2>&1 || flutter pub add flutter_edge_ai flutter_edge_ai_litertlm flutter_edge_ai_embeddings
          E=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name "flutter_edge_ai-2*" | sort | tail -1)
          L=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name "flutter_edge_ai_litertlm-*" | sort | tail -1)
          echo "#### catalog"; sed -n 100,140p $L/lib/src/catalog/generated/litert_catalog.g.dart
          sed -n 2363,2470p $L/lib/src/catalog/generated/litert_catalog.g.dart
          sed -n 2944,3040p $L/lib/src/catalog/generated/litert_catalog.g.dart
          echo "#### embedding_model"; sed -n 25,150p $E/lib/src/embedding/embedding_model.dart
          echo "#### installEmbedder"; grep -rn -A25 "installEmbedder(" $E/lib/flutter_edge_ai.dart $E/lib/src/*.dart | grep -v "^\S*-\s*///" | head -80
          grep -rln "class EmbedderInstallationBuilder\|EmbedderInstall" $E/lib | head; f=$(grep -rln "class EmbedderInstall" $E/lib | head -1); [ -n "$f" ] && grep -n -E "^\s*(Embedder|Future|[A-Za-z<>]+ )[a-zA-Z]+\(|^\s*[A-Za-z<>?]+ [a-zA-Z]+\(" $f | head -60
          echo "#### getActiveEmbedder"; grep -rn -A25 "getActiveEmbedder(" $E/lib/src/flutter_edge_ai*.dart $E/lib/flutter_edge_ai.dart 2>/dev/null | grep -v "///" | head -60
          grep -rn "static.*Embedder\|static.*embedder" $E/lib | head -20
          echo "#### variant"; sed -n 160,260p $E/lib/src/catalog/model_catalog.dart
          echo "#### catalog usage readme"; grep -n -i -B3 -A25 "LiteRtEmbedders\|catalog" $L/README.md | head -120
