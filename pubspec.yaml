name: paperdrive
description: Archivio documenti in stile Paperless-ngx, con OCR sul telefono e sincronizzazione su Google Drive.
publish_to: 'none'
version: 0.16.0+29

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0
  path_provider: ^2.1.6
  path: ^1.9.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  cross_file: ^0.3.4
  pdfrx: ^2.6.5
  pdf: ^3.13.1
  image: ^4.2.0
  google_mlkit_document_scanner: ^0.6.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_barcode_scanning: ^0.16.1
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^17.0.0
  http: ^1.6.0
  crypto: ^3.0.6
  wakelock_plus: ^1.2.8
  # AI sul telefono (LiteRT-LM di Google, gira sulla GPU, niente cloud).
  flutter_edge_ai: ^2.5.0
  flutter_edge_ai_litertlm: ^1.16.0
  # Ultima versione su GitHub: quella su pub.dev non è compatibile con il pacchetto pdf (xml 7).
  enough_mail:
    git:
      url: https://github.com/Enough-Software/enough_mail
      ref: e8b665ace8a54dbebff011cbfb452195230ef333

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Lato-Regular.ttf
    - assets/sRGB2014.icc
    - assets/logo.png
  # Sora (Google Fonts, licenza OFL): il carattere di Dom Studio.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
